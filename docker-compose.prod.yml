# PRODUCȚIE, pe VPS-ul OVH, lângă n8n (decizia din 23.10.2026: fără Coolify). NU pentru dezvoltare.
#
#   cd /opt/servicerotirapid && docker compose -f docker-compose.prod.yml up -d --build
#
# Trei containere:
#   db   - PostgreSQL 16. Fără `ports:`: baza de date NU e accesibilă din internet.
#   ops  - aplică migrările la fiecare pornire; backup criptat și ștergere automată (cron pe server).
#          Singurul cu parola contului proprietar al bazei de date.
#   app  - aplicația. Se conectează cu `app_user` (supus Row-Level Security). Caddy-ul existent (din n8n-docker)
#          face HTTPS și trimite cererile la ea prin rețeaua Docker comună (PROXY_NETWORK).
#
# Secretele stau în fișierul .env de lângă acest fișier (doar pe server, generat de docker/server/generate-env.sh).
# Ghidul complet: docs/productie.md

name: servicerotirapid

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: servicerotirapid
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [intern]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d servicerotirapid"]
      interval: 5s
      timeout: 3s
      retries: 20

  ops:
    build:
      context: .
      target: ops
    restart: unless-stopped
    environment:
      MIGRATION_DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?}@db:5432/servicerotirapid
      DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD:?}@db:5432/servicerotirapid
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      # Backup criptat (docs/productie.md). Cheia PUBLICĂ age; cea privată nu stă pe server.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_LOCAL_KEEP_DAYS: ${BACKUP_LOCAL_KEEP_DAYS:-7}
      # Copia în afara serverului (orice stocare compatibilă S3). Goale = doar copie locală.
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_KEEP_DAYS: ${BACKUP_S3_KEEP_DAYS:-30}
    volumes:
      - backups:/backups
      - storage:/app/storage
    networks: [intern]
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD:?}@db:5432/servicerotirapid
      # Adresa publică, fără / la final, ex. https://programari.domeniul-tau.ro
      APP_BASE_URL: ${APP_BASE_URL:?}
      AUTH_SECRET: ${AUTH_SECRET:?}
      # Dacă se schimbă, linkurile „vezi / anulează programarea” deja date nu mai merg.
      BOOKING_LINK_SECRET: ${BOOKING_LINK_SECRET:?}
      # Cloudflare Turnstile (gratuit). Fără chei serverul nu pornește, decât cu TURNSTILE_DISABLED=1.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_DISABLED: ${TURNSTILE_DISABLED:-}
    volumes:
      - storage:/app/storage
    networks:
      intern: {}
      proxy:
        # Numele sub care o găsește Caddy: reverse_proxy servicerotirapid-app:3000
        aliases: [servicerotirapid-app]
    depends_on:
      ops:
        condition: service_healthy

networks:
  # Rețeaua proprie: db și ops nu sunt vizibile pentru alte containere de pe server.
  intern: {}
  # Rețeaua lui Caddy (proiectul n8n-docker). Doar `app` e conectat la ea.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-n8n-docker_default}

volumes:
  pgdata:
  storage:
  backups:

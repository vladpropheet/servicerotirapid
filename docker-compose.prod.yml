# PRODUCȚIE: folosit de Coolify (resursă „Docker Compose” din GitHub). NU pentru dezvoltare.
#
# Trei containere, toate în rețeaua internă creată de Coolify:
#   db   - PostgreSQL 16. Fără `ports:`: baza de date NU e accesibilă din internet.
#   ops  - aplică migrările la fiecare deploy; rulează backup-ul și ștergerea automată (task-uri programate).
#          Singurul cu parola contului proprietar al bazei de date.
#   app  - aplicația. Se conectează cu `app_user` (supus Row-Level Security). Primește domeniul în Coolify.
#
# Variabilele ${SERVICE_...} sunt generate automat de Coolify la primul deploy (parole și chei lungi, aleatorii)
# și rămân aceleași la deploy-urile următoare. Celelalte se completează în Coolify → Environment Variables.
# Ghidul complet: docs/productie.md

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: servicerotirapid
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d servicerotirapid"]
      interval: 5s
      timeout: 3s
      retries: 20

  ops:
    build:
      context: .
      target: ops
    restart: unless-stopped
    environment:
      MIGRATION_DATABASE_URL: postgres://app:${SERVICE_PASSWORD_64_POSTGRES}@db:5432/servicerotirapid
      DATABASE_URL: postgres://app_user:${SERVICE_PASSWORD_64_APPUSER}@db:5432/servicerotirapid
      APP_DB_PASSWORD: ${SERVICE_PASSWORD_64_APPUSER}
      # Backup criptat (docs/productie.md, pasul „Backup”). Cheia PUBLICĂ age; cea privată nu stă pe server.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_LOCAL_KEEP_DAYS: ${BACKUP_LOCAL_KEEP_DAYS:-7}
      # Copia în afara serverului (orice stocare compatibilă S3). Goale = doar copie locală.
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_KEEP_DAYS: ${BACKUP_S3_KEEP_DAYS:-30}
    volumes:
      - backups:/backups
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app_user:${SERVICE_PASSWORD_64_APPUSER}@db:5432/servicerotirapid
      # Adresa publică, fără / la final, ex. https://programari.domeniul-tau.ro
      APP_BASE_URL: ${APP_BASE_URL:?}
      AUTH_SECRET: ${SERVICE_BASE64_64_AUTH}
      # Dacă se schimbă, linkurile „vezi / anulează programarea” deja date nu mai merg.
      BOOKING_LINK_SECRET: ${SERVICE_BASE64_64_BOOKINGLINK}
      # Cloudflare Turnstile (gratuit). Fără chei serverul nu pornește, decât cu TURNSTILE_DISABLED=1.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_DISABLED: ${TURNSTILE_DISABLED:-}
    volumes:
      - storage:/app/storage
    depends_on:
      ops:
        condition: service_healthy

volumes:
  pgdata:
  storage:
  backups:
